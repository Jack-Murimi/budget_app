name: budget_app
description: M-Pesa budget tracker for Kenya
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  path: ^1.9.0
  intl: ^0.20.3
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.3.2
  cryptography: ^2.7.0
  file_selector: ^1.0.3
  local_auth: ^3.0.2
  dynamic_color: ^1.9.0
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  flutter_launcher_icons: ^0.13.1
  sqlite3: ^2.4.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg
    - assets/logo_dark.svg

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
