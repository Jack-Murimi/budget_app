<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1B5E20"/>
  
  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#2E7D32" stop-opacity="1"/>
    <stop offset="100%" stop-color="#1B5E20" stop-opacity="1"/>
  </radialGradient>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#glow)"/>

  <!-- Upward growth arrow arc (subtle, behind text) -->
  <path d="M 156 340 Q 256 160 356 340" 
        stroke="#4CAF50" stroke-width="18" stroke-opacity="0.35" 
        fill="none" stroke-linecap="round"/>

  <!-- KE monogram - K -->
  <text x="96" y="330" 
        font-family="Arial Black, sans-serif" 
        font-size="240" 
        font-weight="900" 
        fill="white" 
        letter-spacing="-8">KE</text>

  <!-- Bottom accent bar -->
  <rect x="96" y="400" width="320" height="20" rx="10" fill="#4CAF50" opacity="0.9"/>

  <!-- Small "Ksh" label -->
  <text x="256" y="470" 
        font-family="Arial, sans-serif" 
        font-size="52" 
        font-weight="700" 
        fill="#A5D6A7" 
        text-anchor="middle"
        letter-spacing="4">BUDGET</text>
</svg>